<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<style>
    .field {
        display: flex;
        align-items: center;
        margin-bottom: 5px;
    }

    .field label {
        width: 130px;
        text-align: right;
        margin-right: 20px;
    }

    fieldset {
        background-color: #e0e0ff;
    }

    input[type="text"],
    input[type="password"],
    textarea,
    select {
        box-sizing: border-box;
    }
</style>

<body>
    <h1>Register</h1>

    <form action="processData.php" method="POST">
        <fieldset>
            <legend>Person Details</legend>

            <div class="field">
                <label for="surname">Surname</label>
                <input type="text" name="surname" id="surname" size="31">
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input type="text" name="email" id="email" size="31">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" size="31">
            </div>

            <div class="field">
                <label for="address">Street Address</label>
                <textarea name="address" id="address" rows="3" cols="22"></textarea>
            </div>

            <div class="field">
                <label for="state">State</label>
                <select name="state" id="state">
                    <option value="-1" selected>Choose your state</option>
                    <option value="1">Australian Capital Territory</option>
                    <option value="2">Queensland</option>
                    <option value="3">Victoria</option>
                    <option value="4">New South Wales</option>
                    <option value="5">Tasmania</option>
                    <option value="6">South Australia</option>
                    <option value="7">Western Australia</option>
                    <option value="8">Northern Territory</option>
                </select>
            </div>

            <div class="field">
                <input type="hidden" name="country" value="Australia">
            </div>

            <div class="field">
                <label>Gender</label>
                <input type="radio" name="sex" value="Male">Male
                <input type="radio" name="sex" value="Female">Female
            </div>

            <div class="field">
                <label for="vegetarian">Vegetarian?</label>
                <input type="checkbox" name="vegetarian" id="vegetarian" value="Yes">
            </div>

            <div class="field">
                <label>&nbsp;</label>
                <input type="submit" value="Submit" name="submit">
                <input type="reset" value="Reset" name="reset">
            </div>
        </fieldset>
    </form>
</body>

</html>
